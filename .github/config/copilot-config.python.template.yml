# Repo-Level Config for Python Projects
# Generated by: gh copilot agent repo-config
# This file is gitignored — each developer generates their own copy.
# Run `gh copilot agent repo-config` to regenerate.

project:
  language: Python
  python_version: {{PYTHON_VERSION}}  # e.g., 3.11, 3.12
  package_manager: {{PKG_MANAGER}}    # pip | poetry | uv | conda
  framework: {{FRAMEWORK}}            # django | fastapi | flask | none

package:
  name: {{PACKAGE_NAME}}              # e.g., my_app
  src_path: {{SRC_PATH}}              # e.g., src | app | .
  test_path: {{TEST_PATH}}            # e.g., tests

testing:
  framework: {{TEST_FRAMEWORK}}       # pytest | unittest
  coverage_tool: coverage             # coverage.py
  aaa_comments: true

# Pattern file references
pattern_files:
  test_patterns: .github/patterns/test-patterns.yml
  review_patterns: .github/patterns/review-patterns.yml

# Token economy settings
token_economy:
  cache_config: true
  cache_patterns: true
  progressive_disclosure: true
  max_context_reads: 3
  avoid_semantic_search: true

# Session cache
session_cache:
  values_to_cache:
    - project.language
    - project.python_version
    - project.framework
    - package.name
    - package.test_path
    - testing.framework
  cache_duration: session
