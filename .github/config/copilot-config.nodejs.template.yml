# Repo-Level Config for Node.js / TypeScript Projects
# Generated by: gh copilot agent repo-config
# This file is gitignored — each developer generates their own copy.
# Run `gh copilot agent repo-config` to regenerate.

project:
  language: JavaScript/TypeScript
  runtime: Node.js
  node_version: {{NODE_VERSION}}      # e.g., 20, 22
  package_manager: {{PKG_MANAGER}}    # npm | yarn | pnpm
  framework: {{FRAMEWORK}}            # express | nestjs | nextjs | react | vue | angular | none

package:
  name: {{PACKAGE_NAME}}              # from package.json name field
  src_path: {{SRC_PATH}}              # e.g., src
  test_path: {{TEST_PATH}}            # e.g., src/__tests__ | test | spec

testing:
  framework: {{TEST_FRAMEWORK}}       # jest | vitest | mocha
  coverage_tool: {{COVERAGE_TOOL}}    # istanbul | v8 | c8
  aaa_comments: true

# Pattern file references
pattern_files:
  test_patterns: .github/patterns/test-patterns.yml
  review_patterns: .github/patterns/review-patterns.yml

# Token economy settings
token_economy:
  cache_config: true
  cache_patterns: true
  progressive_disclosure: true
  max_context_reads: 3
  avoid_semantic_search: true

# Session cache
session_cache:
  values_to_cache:
    - project.language
    - project.node_version
    - project.framework
    - package.name
    - package.test_path
    - testing.framework
  cache_duration: session
