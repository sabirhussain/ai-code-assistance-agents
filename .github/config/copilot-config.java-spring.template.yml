# Repo-Level Config for Java / Spring Boot Projects
# Generated by: gh copilot agent repo-config
# This file is gitignored — each developer generates their own copy.
# Run `gh copilot agent repo-config` to regenerate.

project:
  language: Java
  lang_version: {{LANG_VERSION}}      # e.g., 17, 21
  build_tool: {{BUILD_TOOL}}          # Maven | Gradle

framework:
  spring_boot_version: {{SPRING_BOOT_VERSION}}  # e.g., 3.5.11

package:
  base: {{BASE_PACKAGE}}              # e.g., com.example.payments
  test_path: {{TEST_PATH}}            # e.g., src/test/java/com/example/payments
  main_path: {{MAIN_PATH}}            # e.g., src/main/java/com/example/payments

testing:
  framework: JUnit 5 + Mockito
  mutation_tool: PIT
  pit_junit5_plugin_version: 1.2.1
  nested_test: true
  aaa_comments: true

# Pattern file references
pattern_files:
  test_patterns: .github/patterns/test-patterns.yml
  review_patterns: .github/patterns/review-patterns.yml

# Token economy settings
token_economy:
  cache_config: true
  cache_patterns: true
  progressive_disclosure: true
  max_context_reads: 3
  avoid_semantic_search: true

# Session cache
session_cache:
  values_to_cache:
    - project.language
    - project.lang_version
    - framework.spring_boot_version
    - package.base
    - package.test_path
    - testing.framework
    - testing.nested_test
  cache_duration: session
