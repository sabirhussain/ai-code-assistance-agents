# Repo-Level Config — Generic (Language-Agnostic)
# Generated by: gh copilot agent repo-config
# This file is gitignored — each developer generates their own copy.
# Run `gh copilot agent repo-config` to regenerate.

project:
  language: {{LANGUAGE}}              # e.g., Go, Rust, Ruby, C#
  version: {{LANG_VERSION}}           # e.g., 1.22 (Go), 8 (Ruby)
  framework: {{FRAMEWORK}}            # e.g., gin, rails, asp.net, none

package:
  name: {{PACKAGE_NAME}}              # project/module name
  src_path: {{SRC_PATH}}              # e.g., src | lib | .
  test_path: {{TEST_PATH}}            # e.g., tests | spec | _test

testing:
  framework: {{TEST_FRAMEWORK}}       # e.g., go test, rspec, xunit
  aaa_comments: true

# Pattern file references
pattern_files:
  test_patterns: .github/patterns/test-patterns.yml
  review_patterns: .github/patterns/review-patterns.yml

# Token economy settings
token_economy:
  cache_config: true
  cache_patterns: true
  progressive_disclosure: true
  max_context_reads: 3
  avoid_semantic_search: true

# Session cache
session_cache:
  values_to_cache:
    - project.language
    - project.version
    - project.framework
    - package.name
    - package.test_path
    - testing.framework
  cache_duration: session
